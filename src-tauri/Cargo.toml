[package]
name = "nexus1"
version = "3.0.0"
description = "Agentic AI Platform — Secure, Local, Multi-Model Collaboration"
authors = ["NEXUS 1.0"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nexus1_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nexus1"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
candle-kernels = "0.8"
hf-hub = "0.3"
tokenizers = "0.20"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = "1"
secrecy = "0.8"
rand = "0.8"
dirs = "5"
sha2 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
thiserror = "1"
parking_lot = "0.12"
dashmap = "6"
flate2 = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
